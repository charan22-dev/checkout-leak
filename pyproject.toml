[project]
name = "checkout-leak"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Charan Narayan", email = "charannarayann@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "db-dtypes>=1.9.0",
    "duckdb>=2.0.1",
    "google-cloud-bigquery>=3.47.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
checkout-leak = "checkout_leak:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
